# Configuracion de Prometheus para el stack de monitoreo de AndesLink Churn
# Scrapea el endpoint /metrics de la API por la red interna de Docker

global:
  scrape_interval: 15s # frecuencia de scrape por defecto
  scrape_timeout: 10s
  evaluation_interval: 15s

# reglas de recording y alertas, montadas en el container por el compose
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # metricas propias de Prometheus, sirven para verificar que el server esta vivo
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API de inferencia de churn
  # el target se resuelve por el DNS interno de Docker (nombre del servicio)
  # el label job=churn-api habilita la query up{job="churn-api"} de disponibilidad
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
