name: CI

# Triggers:
# - push a main y dev: validacion post-merge.
# - PR contra main y dev: validacion pre-merge (lo que mas importa).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancelar runs anteriores del mismo branch/PR cuando llega uno nuevo.
# Ahorra minutos de CI y evita ver resultados obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Linting + Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Print versions (debug)
        run: |
          python --version
          ruff --version
          pip list

      - name: Ruff check
        run: make check

      - name: Smoke tests
        run: make smoke
