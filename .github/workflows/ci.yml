name: CI

# Triggers:
# - push a main y dev: validacion post-merge.
# - PR contra main y dev: validacion pre-merge (lo que mas importa).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancelar runs anteriores del mismo branch/PR cuando llega uno nuevo.
# Ahorra minutos de CI y evita ver resultados obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Linting + Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Print versions (debug)
        run: |
          python --version
          ruff --version
          pip list

      - name: Ruff check
        run: make check

      - name: Smoke tests
        run: make smoke

      # tests: GUI con mockTransport + contrato de schema
      # no tocan nada, corren siempre sin dvc pull
      - name: Tests puros (GUI + schema)
        run: pytest tests/test_gui.py -v

  integration-tests:
    name: Tests de API (requiere modelo via dvc pull)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: quality-checks
    # !! no bloquea el merge si B2 esta caido o el bucket deja de ser legible:
    # el check aparece igual pero un fallo de infra no pinta main en rojo
    # uno nunca puede confiarse del todo los servicios cloud
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install 'dvc[http]==3.55.2' 'pathspec<0.12'
      # trae el modelo desde el remote publico b2_read (es publico)
      - name: DVC pull (modelo)
        run: dvc pull models/churn_model_v2.joblib

      - name: Verificar que el artefacto bajo
        run: |
          if [ -f models/churn_model_v2.joblib ]; then
            echo "modelo presente"
          else
            echo "modelo ausente, el dvc pull no trajo el artefacto"
            exit 1
          fi

      # Los tests de API levantan la app real: el lifespan carga el .joblib
      # y verifica la version de sklearn, asi que sirven de smoke de carga
      - name: Tests de API
        run: pytest tests/test_api.py -v

