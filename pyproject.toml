[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "notebooks",
    "mlruns",
    ".dvc",
    "data",
    "models",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
# Sin ignore: el límite de 100 chars es enforced.
# Si una línea no se puede romper razonablemente, usar # noqa: E501 inline.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
